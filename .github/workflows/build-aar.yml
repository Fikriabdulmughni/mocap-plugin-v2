name: Build MocapPlugin AAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unduh model pose MediaPipe
        run: |
          mkdir -p mocap/src/main/assets
          curl -L -o mocap/src/main/assets/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build AAR
        run: gradle :mocap:assembleRelease

      - name: Salin AAR
        run: cp mocap/build/outputs/aar/mocap-release.aar MocapPlugin.aar

      - uses: actions/upload-artifact@v4
        with:
          name: MocapPlugin
          path: |
            MocapPlugin.aar
            MocapPlugin.gdap
